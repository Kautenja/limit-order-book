[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "limit_order_book"
version = "2.0.0"
description = "A Limit Order Book (LOB) implementation"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Christian Kauten", email = "kautencreations@gmail.com"},
]
keywords = ["Limit Order Book", "Matching Engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/Kautenja/limit-order-book"
Repository = "https://github.com/Kautenja/limit-order-book"
Documentation = "https://kautenja.github.io/limit-order-book/"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["limit_order_book*"]
exclude = ["limit_order_book.test*"]

[tool.cibuildwheel]
build = "cp313-* cp314-*"
skip = "*-musllinux_*"
test-command = 'python -c "from limit_order_book import LimitOrderBook; book = LimitOrderBook(); book.limit_sell(1, 100, 50); assert book.best_sell() == 50"'
build-verbosity = 1

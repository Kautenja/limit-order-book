[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "limit_order_book"
version = "2.0.0"
description = "A Limit Order Book (LOB) implementation"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Christian Kauten", email = "kautencreations@gmail.com"},
]
keywords = ["Limit Order Book", "Matching Engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/Kautenja/limit-order-book"
Repository = "https://github.com/Kautenja/limit-order-book"
Documentation = "https://kautenja.github.io/limit-order-book/"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["limit_order_book*"]
exclude = ["limit_order_book.test*"]

# The shared library that the Python package loads through ctypes. No
# standard or optimization flags are set, so the compiler defaults apply:
# C++17 for current GCC and Clang, C++14 for MSVC, and the optimization level
# Python was built with. Wheels run on other machines, so never add
# -march=native or other host-tuned flags here.
[[tool.setuptools.ext-modules]]
name = "limit_order_book.lib_limit_order_book"
sources = ["src/lib_lob.cpp"]
include-dirs = [
    "include",
    "vendor/binary-search-tree/include",
    "vendor/cpptqdm/include",
    "vendor/doubly-linked-list/include",
    "vendor/hopscotch_map/include",
    "vendor/robin-map/include",
    "vendor/sparse-map/include",
]
language = "c++"

# Keep setuptools intermediates under .build/ with the SCons outputs instead
# of build/ in the repository root. The *.egg-info/ metadata stays in the
# root, because setuptools requires its base directory to already exist.
[tool.distutils.build]
build-base = ".build/python"

[tool.cibuildwheel]
build = "cp313-* cp314-*"
skip = "*-musllinux_*"
test-command = 'python -c "from limit_order_book import LimitOrderBook; book = LimitOrderBook(); book.limit_sell(1, 100, 50); assert book.best_sell() == 50"'
build-verbosity = 1

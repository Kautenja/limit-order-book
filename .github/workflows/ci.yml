name: CI

'on':
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'

permissions:
  contents: read

jobs:
  report:
    name: Technical report
    uses: ./.github/workflows/report.yml
    permissions:
      # The reusable workflow restricts the build to read access; its
      # published-release upload job needs write access and is skipped here.
      contents: write

  native-test:
    name: C++ / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: Windows x64
            runner: windows-2022
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS arm64
            runner: macos-15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run Catch2 suites
        run: ./main.sh test-cpp

      - name: Check the installed and FetchContent packages
        run: ./main.sh test-package

  build-test:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.13'
          - '3.14'
        platform:
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - name: Windows x64
            runner: windows-2022
            artifact: windows-x64
          - name: macOS x64
            runner: macos-15-intel
            artifact: macos-x64
          - name: macOS arm64
            runner: macos-15
            artifact: macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        env:
          PYTHON: python
        run: ./main.sh test-python

      - name: Clean test build artifacts
        run: git clean -fdX

      - name: Build distributions
        run: python -m build --outdir .build/dist

      - name: Test the installed wheel
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall .build/dist/*.whl
          python -I test/package/python.py

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: limit-order-book-${{ matrix.platform.artifact }}-py${{ matrix.python-version }}-dist
          path: .build/dist/*
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Attach tag release artifacts
    needs:
      - native-test
      - build-test
      - report
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: limit-order-book-*-dist
          path: release-dist
          merge-multiple: true

      - name: Download technical report
        uses: actions/download-artifact@v8
        with:
          name: limit-order-book-report
          path: release-dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Automated release for $TAG_NAME"
          gh release upload "$TAG_NAME" release-dist/* --clobber
